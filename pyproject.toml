[project]
name = "coalguard"
version = "0.1.0"
description = "AI-Enabled Governance Platform for Coal Mining"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # --- Web UI ---
    "streamlit>=1.35.0",
    "streamlit-drawable-canvas>=0.9.0",
    "streamlit-folium>=0.15.0",

    # --- Database ---
    "sqlalchemy>=2.0.0",

    # --- Data & Charts ---
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "numpy>=1.26.0",

    # --- Map ---
    "folium>=0.15.0",

    # --- PDF Reports ---
    "reportlab>=4.0.0",

    # --- CV / AI (heavy — install separately if no GPU) ---
    "ultralytics>=8.2.0",
    "opencv-python>=4.9.0",

    # --- Tracking ---
    "deep-sort-realtime>=1.3.2",

    # --- Voice alerts ---
    "gtts>=2.3.0",
    "pygame>=2.5.0",

    # --- Utilities ---
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Install GPU PyTorch manually: https://pytorch.org/get-started/locally/
# uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
gpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]
# CPU-only torch (slower inference)
cpu = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
]
# Dev tools
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
